services:
  toonflow:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - toonflowData:/app/data
    # ACT: 部分 macOS + Docker Desktop + 公司代理环境下,Bun 的 fetch 校验
    # ModelVerse 服务器证书链时偶发 UNABLE_TO_VERIFY_LEAF_SIGNATURE；显式指定系统
    # CA bundle 让 Bun 信任代理注入的中间证书。
    environment:
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt

volumes:
  toonflowData:
